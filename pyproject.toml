[project]
name = "sizzlefrosting"
version = "2.0.0"
description = "Homework 00, 01, and 02"
readme = "README.md"
authors = [
    { name = "sizzlefrosting", email = "sizzlefrosting@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "twine>=7.0.0",
]

[tool.maturin]
module-name = "sizzlefrosting._core"
python-packages = ["sizzlefrosting"]
python-source = "src"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"
